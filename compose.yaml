services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bughunter
      POSTGRES_USER: bughunter
      POSTGRES_PASSWORD: bughunter
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bughunter -d bughunter']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: setup
    environment:
      DATABASE_URL: postgresql://bughunter:bughunter@postgres:5432/bughunter?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bughunter.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-CodeTrace Admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: runtime
    environment:
      DATABASE_URL: postgresql://bughunter:bughunter@postgres:5432/bughunter?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
      target: runtime
    environment:
      DATABASE_URL: postgresql://bughunter:bughunter@postgres:5432/bughunter?schema=public
      REDIS_URL: redis://redis:6379
      JUDGE_IMAGE: ${JUDGE_IMAGE:-python:3.12-alpine}
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '${DOCKER_GID:-0}'
    depends_on:
      api:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://api:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      target: runtime
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
