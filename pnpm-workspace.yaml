packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma

autoInstallPeers: false
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false
